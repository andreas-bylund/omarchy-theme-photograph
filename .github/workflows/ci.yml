name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck imagemagick jq

      - name: Syntax
        run: |
          bash -n bin/omarchy-theme-photograph lib/*.sh scripts/*.sh vm/vm.sh assets/terminal-showcase.sh install.sh test/run.sh scripts/readme-images.sh
          python3 -m py_compile scripts/fetch-theme-list.py

      - name: shellcheck
        run: shellcheck -S warning -x bin/omarchy-theme-photograph lib/*.sh scripts/*.sh vm/vm.sh assets/terminal-showcase.sh install.sh test/run.sh

      - name: Tests
        run: test/run.sh
